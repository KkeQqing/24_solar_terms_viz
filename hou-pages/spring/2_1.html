<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    /* 样式完全同上，此处省略以节省篇幅 */
    .scroll-component {
      all: initial;
      display: block;
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      box-sizing: border-box;
    }
    .scroll-component * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .scroll-container {
      width: 100%;
      height: 100%;
      background-color: #f9f3e3;
      border: 8px solid #d9c49c;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      box-sizing: border-box;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0 0h100v100H0z" fill="none"/><path d="M10 10c0 0 20 10 40 0s40 10 40 0" stroke="%23e6d7b9" stroke-width="0.5" fill="none"/></svg>');
      background-size: 200px 200px;
      overflow: hidden;
    }
    .scroll-container::before,.scroll-container::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 24px;
      background: #e8d9bf;
      border-radius: 6px;
      z-index: 1;
    }
    .scroll-container::before { left: -12px; }
    .scroll-container::after { right: -12px; }

    .top-section {
      display: flex;
      flex: 4;
      padding: 18px 20px 14px;
      gap: 20px;
    }
    .left-title-bar {
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #e6b8b7;
      border-radius: 8px;
      padding: 14px;
      background: rgba(255,255,255,0.5);
    }
    .festival-name { font-family: KaiTi, serif; font-size: 50px; font-weight: bold; color: #333; margin-bottom: 8px; }
    .divider { width: 80%; height: 1px; background: #e6b8b7; margin-bottom: 8px; }
    .festival-info { text-align: center; font-size: 15px; color: #555; line-height: 1.5; }

    .middle-poem-area {
      flex: 1;
      display: flex;
      gap: 16px;
      border: 2px solid #e6b8b7;
      border-radius: 8px;
      padding: 14px;
      background: rgba(255,255,255,0.5);
    }
    .poem-column { flex: 1; display: flex; justify-content: center; align-items: center; }
    .poem-text { font-family: KaiTi, serif; font-size: 21px; line-height: 1.75; writing-mode: vertical-rl; text-orientation: upright; color: #444; }
    .poem-author { font-family: KaiTi, serif; font-size: 19px; writing-mode: vertical-rl; text-orientation: upright; color: #555; margin-right: 8px; }
    .author-seal { width: 22px; height: 22px; background: #b83a3a; border-radius: 2px; margin-top: 14px; }
    .illustration-column { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .hou-label { font-family: KaiTi, serif; font-size: 21px; writing-mode: vertical-rl; text-orientation: upright; color: #555; margin-right: 14px; }
    .illustration-placeholder {
      width: 190px;
      height: 145px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><path d="M100 130c-10 0-15-5-20-15-5-8-10-15-15-20-10-10-15-15-15-15s10 5 20 15c8 8 15 15 20 25 5 10 10 15 10 15z" fill="%238B4513"/><circle cx="130" cy="50" r="15" fill="%23FFB6C1"/><circle cx="130" cy="50" r="8" fill="%23FF69B4"/><circle cx="100" cy="70" r="12" fill="%23FFB6C1"/><circle cx="100" cy="70" r="6" fill="%23FF69B4"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .proverb-text { margin-top: 10px; font-size: 15px; color: #555; text-align: center; }

    .bottom-info-grid { display: flex; flex: 1; padding: 0 20px 16px 20px; gap: 14px; }
    .info-card { flex: 1; border: 2px solid #b8d0b8; border-radius: 8px; padding: 10px; background: rgba(255,255,255,0.5); }
    .card-title { font-family: KaiTi, serif; font-size: 15px; font-weight: bold; color: #6b8e6b; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
    .card-title::before { content: '❀'; font-size: 13px; }
    .card-content { font-size: 13.5px; color: #444; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="scroll-component">
    <div class="scroll-container">
      <div class="top-section">
        <div class="left-title-bar">
          <div class="festival-name">雨水</div>
          <div class="divider"></div>
          <div class="festival-info">
            <div>正月</div>
            <div>黄经 330°</div>
          </div>
        </div>

        <div class="middle-poem-area">
          <div class="poem-column">
            <div class="poem-author">佚名</div>
            <div class="author-seal"></div>
            <div class="poem-text">
              獭祭鱼时雨气浓<br>
              江南春色有无中
            </div>
          </div>
          <div class="illustration-column">
            <div class="hou-label">雨水初候 · 獭祭鱼</div>
            <div class="illustration-placeholder"></div>
            <div class="proverb-text">雨水节，獭祭鱼，春水渐暖鱼上游</div>
          </div>
        </div>
      </div>

      <div class="bottom-info-grid">
        <div class="info-card">
          <div class="card-title">物候解释</div>
          <div class="card-content">水獭捕鱼后陈列岸边，如同祭祀，故名“獭祭鱼”，表示春水渐暖，鱼群活跃。</div>
        </div>
        <div class="info-card">
          <div class="card-title">天文原理</div>
          <div class="card-content">太阳到达黄经330°，降雨增多，万物萌动，地面水汽开始上升。</div>
        </div>
        <div class="info-card">
          <div class="card-title">农事提示</div>
          <div class="card-content">做好春灌准备，清理水渠，果园修剪，油菜追肥。</div>
        </div>
        <div class="info-card">
          <div class="card-title">养生建议</div>
          <div class="card-content">注意保暖防湿，多吃蔬果杂粮，适当按摩经络，防“倒春寒”。</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
