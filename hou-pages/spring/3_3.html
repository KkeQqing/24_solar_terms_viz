<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .scroll-component {
      all: initial;
      display: block;
      width: 100%;
      height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .scroll-container {
      width: 100%;
      height: 100%;
      background-color: #e8f5e9;
      border: 8px solid #4c7a34;
      border-radius: 12px;
      box-shadow: 
        0 0 35px rgba(40,70,20,0.22),
        inset 0 0 45px rgba(100,150,80,0.35),
        0 0 90px rgba(180,220,160,0.55);
      display: flex;
      flex-direction: column;
      position: relative;
      background-image:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" opacity="0.15"><path d="M0 90 Q45 60 90 90 T180 90" stroke="%23a5d6a7" stroke-width="0.8" fill="none"/></svg>'),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" opacity="0.05"><filter id="noise"><feTurbulence baseFrequency="0.65" numOctaves="3"/></filter><rect width="250" height="250" filter="url(%23noise)"/></svg>');
      background-size: 180px 180px, 250px 250px;
      overflow: hidden;
      animation: thunderBreath 4.2s infinite ease-in-out, unfold 1.2s ease-out;
    }

    /* 春雷呼吸光影（优化更自然） */
    @keyframes thunderBreath {
      0%,100%{filter:brightness(1);}
      50%{filter:brightness(1.12);box-shadow:0 0 60px #66bb6a77;}
    }

    /* 展开动画优化 */
    @keyframes unfold {
      0%{transform:scaleY(0.18);opacity:0;}
      100%{transform:scaleY(1);opacity:1;}
    }

    /* 侧边玉石质感卷轴（优化渐变） */
    .scroll-container::before,
    .scroll-container::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 26px;
      background: linear-gradient(180deg, #c8e6c9, #a5d6a7);
      border-radius: 6px;
      z-index: 1;
      box-shadow: inset 0 0 18px rgba(70,120,50,0.35);
    }
    .scroll-container::before { left: -13px; }
    .scroll-container::after { right: -13px; }

    /* 落雷粒子（优化动画） */
    .thunder-drop {
      position: absolute;
      width: 3px;
      height: 14px;
      background: linear-gradient(180deg, #69f0ae, #4caf50);
      border-radius: 50px;
      opacity: 0.85;
      animation: thunderFall linear infinite;
      z-index: 2;
      filter: blur(0.3px);
    }
    @keyframes thunderFall {
      0%{transform:translateY(-15px);opacity:1;}
      100%{transform:translateY(950px);opacity:0;}
    }

    /* 碧玉原石（优化质感） */
    .stone {
      position: absolute;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #81c784, #4c7a34);
      border-radius: 7px;
      box-shadow: 0 0 15px rgba(76,122,52,0.5);
      z-index: 3;
      animation: stoneGlow 3.5s infinite alternate ease-in-out;
    }
    @keyframes stoneGlow {
      0%{transform:scale(1);opacity:0.85;}
      100%{transform:scale(1.18);opacity:1;box-shadow:0 0 25px #69f0aeaa;}
    }

    /* 布局优化 */
    .top-section {
      display: flex;
      flex: 4;
      padding: 24px 24px 16px;
      gap: 24px;
    }

    .left-title-bar {
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #66bb6a;
      border-radius: 10px;
      padding: 18px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 6px 18px rgba(102,187,106,0.25);
      transition: 0.4s;
    }
    .left-title-bar:hover {
      transform: translateY(-3px);
    }

    .festival-emoji {
      font-size: 36px;
      animation: thunderShake 2.8s infinite alternate;
    }
    @keyframes thunderShake {
      0%{transform:rotate(-5deg) scale(1);}
      100%{transform:rotate(5deg) scale(1.08);}
    }

    .festival-name {
      font-family: KaiTi, serif;
      font-size: 52px;
      font-weight: bold;
      background: linear-gradient(90deg, #1b5e20, #388e3c, #81c784);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 4s infinite alternate;
    }
    @keyframes titleShine {
      0%{filter:brightness(1);}
      100%{filter:brightness(1.28);}
    }

    .divider {
      width: 85%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #81c784, transparent);
      margin: 8px 0;
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    }
    .divider::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #fff, #69f0ae, transparent);
      animation: flow 3.5s infinite;
    }
    @keyframes flow {
      0%{left:-100%;}100%{left:100%;}
    }

    .festival-info {
      text-align: center;
      font-size: 15px;
      color: #2e4a2f;
      font-weight: 500;
      line-height: 1.5;
    }

    .middle-poem-area {
      flex: 1;
      display: flex;
      gap: 20px;
      border: 2px solid #66bb6a;
      border-radius: 10px;
      padding: 20px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 6px 18px rgba(102,187,106,0.25);  
/* 新增：专属这一块的整张背景图 */
    background-image: url('../img/9.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    /* 叠加原有底色，文字更清晰 */
    background-blend-mode: overlay;
    }
    .poem-column {
      flex:1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .poem-text {
      font-family: KaiTi, serif;
      font-size: 22px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      background: linear-gradient(180deg, #2e7d32, #558b2f);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s infinite ease-in-out;
    }
    @keyframes float {
      0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}
    }

    .poem-author {
      font-family: KaiTi, serif;
      font-size: 19px;
      writing-mode: vertical-rl;
      color: #333;
    }

    /* 篆印优化 */
    .author-seal {
      width: 26px;
      height: 26px;
      background: #2e7d32;
      border-radius: 4px;
      animation: sealPulse 3s infinite;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-family: KaiTi;
      font-weight: bold;
    }
    .author-seal::after{content:"蛰";}
    @keyframes sealPulse {
      0%{transform:scale(1);}50%{transform:scale(1.22);}
    }

    .illustration-column {
      flex:1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .hou-label {
      font-family: KaiTi, serif;
      font-size: 22px;
      writing-mode: vertical-rl;
      color: #2d4a2e;
      animation: sway 2.6s infinite ease-in-out;
    }
    @keyframes sway {
      0%{transform:rotate(0deg);}50%{transform:rotate(-2deg);}
    }

    .illustration-placeholder {
      width: 200px;
      height: 150px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><path fill="%234c7a34" d="M70 110 L100 60 L130 110 Z"/><circle cx="110" cy="55" r="14" fill="%2381c784"/><circle cx="110" cy="55" r="6" fill="%232e7d32"/></svg>');
      background-repeat: no-repeat;
      background-position: center;
      animation: imgSwing 4.5s infinite ease-in-out;
    }
    @keyframes imgSwing {
      0%{transform:translateX(0) rotate(0deg);}
      50%{transform:translateX(3px) rotate(-0.8deg);}
    }

    .proverb-text {
      font-size: 15px;
      color: #333;
      text-align: center;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3.8s steps(28) forwards;
      width: 0;
    }
    @keyframes typing {
      from{width:0;}to{width:100%;}
    }

    .bottom-info-grid {
      display: flex;
      flex: 1;
      padding: 0 24px 24px;
      gap: 18px;
    }

    .info-card {
      flex:1;
      border:2px solid #81c784;
      border-radius:10px;
      padding:14px;
      background:rgba(255,255,255,0.65);
      transition:all 0.4s ease;
    }
    .info-card:hover {
      transform:translateY(-6px) scale(1.03);
      background:rgba(255,255,255,0.9);
      box-shadow:0 10px 22px rgba(100,160,80,0.3);
      border-color:#4caf50;
    }

    .card-title {
      font-family: KaiTi, serif;
      font-size:16px;
      font-weight:bold;
      color:#2e7d32;
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom: 6px;
    }
    .card-title::before {
      content:"💎";
      animation: twinkle 3s infinite;
    }
    @keyframes twinkle {
      0%{opacity:0.7;transform:scale(1);}
      50%{opacity:1;transform:scale(1.25);}
    }

    .card-content {
      font-size:14px;
      color:#333;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="scroll-component">
    <div class="scroll-container">

      <!-- 惊蛰落雷粒子 -->
      <div class="thunder-drop" style="left:12%;animation-duration:5s;animation-delay:0s"></div>
      <div class="thunder-drop" style="left:34%;animation-duration:5.5s;animation-delay:0.8s"></div>
      <div class="thunder-drop" style="left:58%;animation-duration:4.8s;animation-delay:0.3s"></div>
      <div class="thunder-drop" style="left:79%;animation-duration:5.2s;animation-delay:1.2s"></div>
      <div class="thunder-drop" style="left:92%;animation-duration:4.5s;animation-delay:0.5s"></div>

      <!-- 惊蛰碧玉原石 -->
      <div class="stone" style="top:12%;left:8%"></div>
      <div class="stone" style="bottom:18%;right:5%"></div>

      <div class="top-section">
        <div class="left-title-bar">
          <div class="festival-emoji">⚡</div>
          <div class="festival-name">惊蛰</div>
          <div class="divider"></div>
          <div class="festival-info">
            <div>仲春</div>
            <div>黄经 345°</div>
          </div>
        </div>

        <div class="middle-poem-area">
          <div class="poem-column">
            <div class="poem-author">佚名</div>
            <div class="author-seal"></div>
            <div class="poem-text">
              一声大震龙蛇起
              万物生机自此兴
            </div>
          </div>
          <div class="illustration-column">
            <div class="hou-label">惊蛰三候 · 鹰化为鸠</div>
            <div class="illustration-placeholder"></div>
            <div class="proverb-text">惊蛰春雷响，万物长，鹰化为鸠，天地焕新</div>
          </div>
        </div>
      </div>

      <div class="bottom-info-grid">
        <div class="info-card">
          <div class="card-title">三候·鹰化为鸠</div>
          <div class="card-content">鹰渐隐去，斑鸠鸣叫，春气极盛，万物更替，生机盎然。</div>
        </div>
        <div class="info-card">
          <div class="card-title">惊蛰原石</div>
          <div class="card-content">春雷孕玉，生气贯通，原石纳春气，象征新生、觉醒、转运。</div>
        </div>
        <div class="info-card">
          <div class="card-title">春耕要务</div>
          <div class="card-content">全面播种，中耕松土，防治虫害，抢抓春日大好时机。</div>
        </div>
        <div class="info-card">
          <div class="card-title">时令养生</div>
          <div class="card-content">疏肝理气，温补阳气，少酸多甘，助春阳升发。</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 修复JS：正确设置背景色
    document.querySelectorAll('.thunder-drop').forEach(d => {
      const c = ['#69f0ae','#81c784','#4caf50','#a5d6a7'];
      d.style.background = c[Math.floor(Math.random()*c.length)];
    });
  </script>
</body>
</html>
