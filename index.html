<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岁时华夏 —— 二十四节气文化与物候数据大屏</title>
  <!-- 外部库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/ui.css">
</head>
<body>
  <div class="pattern"></div>
  <div id="particles"></div>
  <div id="toast" class="toast"></div>

  <main class="app">
    <!-- 头部区域 -->
    <header>
      <div class="flex items-center">
        <div class="title-mark"></div>
        <div>
          <h1 class="text-3xl font-black tracking-tighter">岁时华夏</h1>
          <p class="font-sans text-xs tracking-[.34em]">CHRONICLES OF THE SEASONS</p>
        </div>
      </div>
      <div class="flex flex-col items-end gap-3">
        <div class="text-right desktop-only">
          <div id="current-date" class="font-sans text-lg font-bold"></div>
          <div class="font-sans text-sm flex items-center justify-end gap-2" style="color:var(--sub)">
            <iconify-icon icon="ph:map-pin-bold"></iconify-icon>
            <span id="region-label">华夏·北方</span>
            <span>|</span>
            <span id="current-solar-term">谷雨</span>
            <span id="next-term-label"></span>
          </div>
        </div>
        <div class="flex flex-wrap justify-end gap-2">
          <button class="btn small-btn" id="data-story-btn" type="button"><iconify-icon icon="ph:chart-donut-bold"></iconify-icon>综合故事</button>
          <button class="btn small-btn" id="auto-btn" type="button"><iconify-icon icon="ph:play-bold"></iconify-icon>自动轮播</button>
          <button class="btn small-btn" id="theme-btn" type="button"><iconify-icon icon="ph:moon-stars-bold"></iconify-icon>昼夜</button>
          <button class="btn small-btn" id="fullscreen-btn" type="button"><iconify-icon icon="ph:corners-out-bold"></iconify-icon>全屏</button>
        </div>
      </div>
    </header>

    <!-- 左侧列 -->
    <section class="left-col">
      <div class="glass p-4 flex flex-col min-h-0 module-card" data-analysis="phenology">
        <div class="card-title">
          <iconify-icon icon="ph:tree-evergreen-bold" style="color:var(--gold)"></iconify-icon>
          <span>南北物候联觉</span>
          <div>
            <button class="region-btn" data-region="north">北方</button>
            <button class="region-btn" data-region="south">南方</button>
          </div>
        </div>
        <div class="chart" id="phenology-chart"></div>
        <p class="hint" id="phenology-desc"></p>
      </div>
      <div class="glass p-3 flex flex-col min-h-0 module-card" data-analysis="climate">
        <div class="card-title">近十年气候变化</div>
        <div class="grid grid-cols-3 gap-1 mt-1 font-sans text-xs">
            <div class="stat-card text-center py-1">
                <p class="hint mb-0 text-[10px]">十年均温</p>
                <div class="text-sm font-bold" id="avg-temp">--</div>
            </div>
            <div class="stat-card text-center py-1">
                <p class="hint mb-0 text-[10px]">均降水</p>
                <div class="text-sm font-bold" id="avg-rain">--</div>
            </div>
            <div class="stat-card text-center py-1">
                <p class="hint mb-0 text-[10px]">趋势</p>
                <div class="text-sm font-bold" id="climate-trend">--</div>
            </div>
        </div>
        <div class="chart flex-1" id="climate-chart"></div>
    </div>
    </section>

    <!-- 中央列 -->
    <section class="center-col">
      <iframe 
        id="hou-iframe" 
        src="" 
        style="width:100%; height:100%; border:none; border-radius:12px; display:block; overflow:hidden;"
        title="候详情"
      ></iframe>
    </section>

    <!-- 右侧列 -->
    <section class="right-col">
      <!-- 民俗卡片（占比较大） -->
      <div class="glass p-4 flex flex-col min-h-0 module-card" data-analysis="folk">
        <div class="card-title">
          <iconify-icon style="color:var(--gold)" icon="ph:users-three-bold"></iconify-icon>
          <span>华夏民俗分布</span>
        </div>
        <div class="flex-1" id="folk-chart"></div>
      </div>

      <!-- 旅游改为节气趣味科普小卡片 -->
      <div class="glass p-4 flex flex-col min-h-0 module-card" data-analysis="travel">
        
        <div class="flex-1 font-sans text-sm overflow-y-auto" id="travel-card"></div>
      </div>
    </section>

    <!-- 底部时间轴 -->
    <section class="glass timeline-card p-4 flex flex-col items-center" style="min-height: auto; height: auto; overflow: visible;">
      <div class="absolute left-5 top-4 z-10 px-3 py-1 rounded-full border text-xs font-bold bg-white/70" style="color:var(--gold);border-color:rgba(214,169,40,.45)">72候轴</div>
      <div class="absolute left-28 right-28 top-6 season-strip"></div>
      <div id="timeline" class="timeline-scroll w-full flex px-20 pt-6" style="overflow-y: hidden; align-items: flex-start;"></div>
    </section>
  </main>

  <!-- ==============================================
     模态弹窗容器合集
     共4个弹窗：数据分析 / 节气详情 / 节气对比 / 节气海报
     ============================================== -->
  <!-- 1. 节气数据分析弹窗 -->
  <div class="modal" id="analysis-modal">
    <div class="modal-card">
      <!-- 头部：标题 + 关闭按钮 -->
      <div class="flex justify-between items-start gap-4 mb-2">
        <div>
          <h2 class="text-2xl font-black" id="analysis-title">节气数据分析</h2>
          <p class="hint" id="analysis-subtitle"></p>
        </div>
        <button class="btn small-btn" type="button" data-close="analysis-modal">
          <iconify-icon icon="ph:x-bold"></iconify-icon>
        </button>
      </div>

      <!-- KPI 指标网格 -->
      <div class="modal-kpi-grid" id="analysis-kpis"></div>

      <!-- 图表 + 分析结论 双栏 -->
      <div class="grid md:grid-cols-[1.15fr_.85fr] gap-4">
        <!-- 图表区域 -->
        <div class="glass p-4 shadow-none" style="height:420px">
          <div id="analysis-chart" style="width:100%;height:100%"></div>
        </div>
        <!-- 分析结论 + 数据口径 -->
        <div class="glass p-4 shadow-none font-sans text-sm leading-7">
          <h3 class="modal-section-title">分析</h3>
          <div id="analysis-text"></div>

        </div>
      </div>
    </div>
  </div>

  <!-- 2. 节气详情弹窗 -->
  <div class="modal" id="detail-modal">
    <div class="modal-card">
      <!-- 头部：标题 + 关闭按钮 -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black" id="detail-title"></h2>
        <button class="btn small-btn" type="button" data-close="detail-modal">
          <iconify-icon icon="ph:x-bold"></iconify-icon>
        </button>
      </div>

      <!-- 双栏：节气概览 / 民俗农事 -->
      <div class="grid md:grid-cols-2 gap-4 font-sans text-sm leading-7">
        <div class="glass p-4 shadow-none">
          <h3 class="font-bold mb-2">节气概览</h3>
          <p id="detail-summary"></p>
        </div>
        <div class="glass p-4 shadow-none">
          <h3 class="font-bold mb-2">民俗与农事</h3>
          <p id="detail-custom"></p>
        </div>
      </div>

      <!-- 下方：数据解读 -->
      <div class="glass p-4 shadow-none mt-4 font-sans text-sm leading-7">
        <h3 class="font-bold mb-2">数据解读</h3>
        <p id="detail-data"></p>
      </div>
    </div>
  </div>

  <!-- 3. 节气数据对比弹窗 -->
  <div class="modal" id="compare-modal">
    <div class="modal-card">
      <!-- 头部：标题 + 关闭按钮 -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black">节气数据对比</h2>
        <button class="btn small-btn" type="button" data-close="compare-modal">
          <iconify-icon icon="ph:x-bold"></iconify-icon>
        </button>
      </div>

      <!-- 下拉选择 + 对比按钮 -->
      <div class="grid grid-cols-[1fr_1fr_auto] gap-3 mb-2 font-sans">
        <select id="compare-a" class="rounded-xl border px-3 py-3 bg-white text-gray-800"></select>
        <select id="compare-b" class="rounded-xl border px-3 py-3 bg-white text-gray-800"></select>
        <button class="btn active px-5" id="compare-render-btn" type="button">对比</button>
      </div>

      <p class="hint mb-2">对比结果包含气温、降雨、物候、农时、文旅五项指标。</p>

      <!-- 对比图表容器 -->
      <div id="compare-chart" style="height:390px"></div>
    </div>
  </div>

  <!-- 脚本引入 (按模块顺序) -->
  <script src="assets/js/core/data.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/config.js"></script>

  <script src="assets/js/charts/phenology.js"></script>
  <script src="assets/js/charts/climate.js"></script>
  <script src="assets/js/charts/map.js"></script>
  <script src="assets/js/charts/folk.js"></script>
  <script src="assets/js/charts/travel.js"></script>
  <script src="assets/js/modules/timeline.js"></script>
  <script src="assets/js/modules/autoplay.js"></script>
  <script src="assets/js/modules/theme.js"></script>
  <script src="assets/js/modules/poster.js"></script>
  <script src="assets/js/modules/analysis.js"></script>
  <script src="assets/js/modules/compare.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/events.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
