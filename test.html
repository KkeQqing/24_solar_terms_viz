<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁时轮转 · 七十二候</title>
    <style>
        :root {
            --spring: #6B9B4A;
            --spring-light: #8DB76B;
            --summer: #C44D3D;
            --summer-light: #E0705E;
            --autumn: #C8893D;
            --autumn-light: #DBA960;
            --winter: #7A9BB5;
            --winter-light: #A3C0D6;
            --gold: #C9A96E;
            --gold-bright: #E0C68C;
            --bg: #1a1a16;
            --panel-bg: #1f1e18;
            --text: #e8e0d0;
            --text-dim: #b0a890;
            --card-bg: #27251d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', 'Songti SC', 'KaiTi', '楷体', '华文楷体', serif;
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(ellipse at center, #2a2820 0%, #141410 70%);
        }
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            min-height: 700px;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 10px 20px;
            position: relative;
        }
        .left-panel {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        .left-panel .season-visual {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 8px;
            color: var(--gold-bright);
            text-shadow: 0 0 30px rgba(201, 169, 110, 0.5);
            transition: all 0.6s ease;
            line-height: 1.6;
            background: linear-gradient(180deg, transparent 0%, rgba(201, 169, 110, 0.08) 50%, transparent 100%);
            padding: 20px 10px;
            border-radius: 12px;
            border-left: 2px solid rgba(201, 169, 110, 0.3);
        }
        .left-panel .season-visual .pinyin {
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-top: 10px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .left-panel .mini-icon {
            font-size: 3rem;
            opacity: 0.7;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
        .canvas-wrapper {
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas#wheelCanvas {
            cursor: grab;
            display: block;
            filter: drop-shadow(0 0 40px rgba(180, 150, 100, 0.25));
            transition: filter 0.8s ease;
        }
        canvas#wheelCanvas:active {
            cursor: grabbing;
        }
        canvas#wheelCanvas:hover {
            filter: drop-shadow(0 0 60px rgba(200, 170, 110, 0.4));
        }
        .right-panel {
            width: 160px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .btn-gold {
            width: 130px;
            padding: 13px 16px;
            background: linear-gradient(135deg, #3d3525 0%, #524630 100%);
            border: 1.5px solid var(--gold);
            color: var(--gold-bright);
            border-radius: 24px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.35s ease;
            text-align: center;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #524630 0%, #6b5940 100%);
            border-color: var(--gold-bright);
            box-shadow: 0 0 25px rgba(201, 169, 110, 0.35);
            transform: translateY(-2px);
            color: #fff;
        }
        .btn-gold:active {
            transform: scale(0.95);
            transition: all 0.1s ease;
        }
        .btn-gold .btn-icon {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .detail-card-outer {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px 18px;
            z-index: 20;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(-50%) translateX(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            max-height: 60vh;
            overflow-y: auto;
        }
        .detail-card-outer.visible {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
        .detail-card-outer h3 {
            color: var(--gold-bright);
            font-size: 1.2rem;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 3px;
        }
        .detail-card-outer .detail-item {
            margin: 8px 0;
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .detail-card-outer .detail-item strong {
            color: var(--text);
            display: inline-block;
            min-width: 50px;
        }
        .detail-card-outer .detail-icon {
            font-size: 2.5rem;
            text-align: center;
            margin: 10px 0;
            animation: floatIcon 2.5s ease-in-out infinite;
        }
        .bottom-bar {
            width: 100%;
            max-width: 1300px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 30px;
            background: var(--panel-bg);
            border-top: 1px solid rgba(201, 169, 110, 0.25);
            border-radius: 16px 16px 0 0;
            min-height: 90px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .bottom-bar .poem {
            flex: 1;
            min-width: 200px;
            font-style: italic;
            color: var(--text-dim);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.7;
        }
        .bottom-bar .health-tip {
            flex: 1;
            min-width: 200px;
            color: #c9b896;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.7;
            border-left: 1px solid rgba(201, 169, 110, 0.3);
            padding-left: 20px;
            letter-spacing: 1px;
        }
        .timeline-row {
            width: 100%;
            max-width: 1300px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 4px;
        }
        .timeline-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #ccc;
            position: relative;
            flex-shrink: 0;
        }
        .timeline-dot:hover {
            transform: scale(1.3);
            border-color: var(--gold-bright);
            box-shadow: 0 0 14px rgba(201, 169, 110, 0.5);
            z-index: 5;
        }
        .timeline-dot.active {
            border-color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(201, 169, 110, 0.7);
            transform: scale(1.25);
            z-index: 5;
            animation: pulseDot 1.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(201, 169, 110, 0.7);
            }
            50% {
                box-shadow: 0 0 35px rgba(240, 200, 130, 1);
            }
        }
        .season-spring {
            background: var(--spring);
        }
        .season-summer {
            background: var(--summer);
        }
        .season-autumn {
            background: var(--autumn);
        }
        .season-winter {
            background: var(--winter);
        }
        .overlay-compare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .overlay-compare.active {
            opacity: 1;
            pointer-events: auto;
        }
        .compare-card {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 28px 24px;
            width: 90%;
            max-width: 700px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .compare-col {
            flex: 1;
            min-width: 200px;
            text-align: center;
            border: 1px dashed rgba(201, 169, 110, 0.4);
            border-radius: 12px;
            padding: 16px;
        }
        .compare-col h4 {
            color: var(--gold-bright);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .compare-col p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin: 4px 0;
            line-height: 1.5;
        }
        .compare-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            z-index: 101;
        }
        .sidebar-detail {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100%;
            background: var(--panel-bg);
            border-left: 2px solid var(--gold);
            z-index: 90;
            padding: 30px 22px;
            overflow-y: auto;
            transition: right 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
        }
        .sidebar-detail.open {
            right: 0;
        }
        .sidebar-detail h3 {
            color: var(--gold-bright);
            letter-spacing: 3px;
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 16px;
        }
        .sidebar-detail .section {
            margin: 14px 0;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 10px;
            border-left: 3px solid var(--gold);
        }
        .sidebar-detail .section h5 {
            color: #e0c68c;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .sidebar-detail .section p {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.7;
        }
        .sidebar-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 5;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #141410;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            pointer-events: all;
        }
        .loading-overlay.done {
            opacity: 0;
            pointer-events: none;
        }
        .loading-ring {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(201, 169, 110, 0.3);
            border-top-color: var(--gold-bright);
            border-radius: 50%;
            animation: spinLoad 1s linear infinite;
        }
        @keyframes spinLoad {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 1000px) {
            .main-container {
                flex-direction: column;
                height: auto;
                gap: 10px;
            }
            .left-panel {
                width: 100%;
                flex-direction: row;
                writing-mode: horizontal-tb;
            }
            .left-panel .season-visual {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
                font-size: 1.6rem;
                letter-spacing: 4px;
            }
            .right-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .btn-gold {
                width: auto;
                padding: 10px 14px;
                font-size: 0.8rem;
            }
            .detail-card-outer {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                width: 90%;
                margin: 10px auto;
            }
            .detail-card-outer.visible {
                transform: none;
            }
            canvas#wheelCanvas {
                width: 90vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-ring"></div></div>
    <div class="main-container" id="mainContainer">
        <div class="left-panel" id="leftPanel">
            <div class="mini-icon" id="seasonMiniIcon">🌿</div>
            <div class="season-visual" id="seasonVisual">立夏<span class="pinyin">LI XIA</span></div>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="wheelCanvas"></canvas>
            <div class="detail-card-outer" id="detailCardOuter">
                <h3 id="detailTitle">候名</h3>
                <div class="detail-icon" id="detailIcon">🦌</div>
                <div class="detail-item"><strong>序号：</strong><span id="detailIndex">-</span></div>
                <div class="detail-item"><strong>物候：</strong><span id="detailDesc">-</span></div>
                <div class="detail-item"><strong>诗句：</strong><span id="detailPoem">-</span></div>
                <div class="detail-item"><strong>农谚：</strong><span id="detailProverb">-</span></div>
                <div class="detail-item"><strong>吃食：</strong><span id="detailFood">-</span></div>
            </div>
        </div>
        <div class="right-panel" id="rightPanel">
            <button class="btn-gold" id="btnCompare" title="选择两个节气进行对比"><span class="btn-icon">⚖️</span>节气对比</button>
            <button class="btn-gold" id="btnDetail" title="查看当前节气详情"><span class="btn-icon">📜</span>详情查看</button>
            <button class="btn-gold" id="btnReset" title="回到当前时节"><span class="btn-icon">🔄</span>回到今时</button>
        </div>
    </div>
    <div class="timeline-row" id="timelineRow"></div>
    <div class="bottom-bar" id="bottomBar">
        <div class="poem" id="bottomPoem">蝼蝈鸣兮夏气升，蚯蚓出壤王瓜生。</div>
        <div class="health-tip" id="bottomHealth">🍵 立夏养生：宜清心静养、清淡饮食、顺时消暑，多食酸味以固表。</div>
    </div>
    <div class="overlay-compare" id="overlayCompare">
        <button class="compare-close" id="compareClose">✕</button>
        <div class="compare-card" id="compareCard"></div>
    </div>
    <div class="sidebar-detail" id="sidebarDetail">
        <button class="sidebar-close" id="sidebarClose">✕</button>
        <h3 id="sidebarTitle">节气详情</h3>
        <div id="sidebarContent"></div>
    </div>
    <script>
        (function() {
            const allData = buildAllData();
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');
            const detailCard = document.getElementById('detailCardOuter');
            const overlayCompare = document.getElementById('overlayCompare');
            const compareCard = document.getElementById('compareCard');
            const sidebarDetail = document.getElementById('sidebarDetail');
            const sidebarContent = document.getElementById('sidebarContent');
            const sidebarTitle = document.getElementById('sidebarTitle');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const timelineRow = document.getElementById('timelineRow');
            const bottomPoem = document.getElementById('bottomPoem');
            const bottomHealth = document.getElementById('bottomHealth');
            const seasonVisual = document.getElementById('seasonVisual');
            const seasonMiniIcon = document.getElementById('seasonMiniIcon');
            const detailTitle = document.getElementById('detailTitle');
            const detailIcon = document.getElementById('detailIcon');
            const detailIndex = document.getElementById('detailIndex');
            const detailDesc = document.getElementById('detailDesc');
            const detailPoem = document.getElementById('detailPoem');
            const detailProverb = document.getElementById('detailProverb');
            const detailFood = document.getElementById('detailFood');
            const btnCompare = document.getElementById('btnCompare');
            const btnDetail = document.getElementById('btnDetail');
            const btnReset = document.getElementById('btnReset');
            const compareClose = document.getElementById('compareClose');
            const sidebarClose = document.getElementById('sidebarClose');

            let canvasSize = 0;
            let centerX = 0,
                centerY = 0;
            let currentSolarIndex = allData.solarTerms.findIndex(s => s.isCurrent) || 6;
            let currentHouIndex = allData.solarTerms[currentSolarIndex].currentHouIndex || 0;
            let rotationOffset = 0;
            let targetRotation = 0;
            let selectedHouGlobal = null;
            let isDragging = false;
            let dragStartAngle = 0;
            let dragStartRotation = 0;
            let animationId = null;
            let compareMode = false;
            let compareFirst = null;
            let compareSecond = null;
            let hoveredHouGlobal = null;
            let mouseX = 0,
                mouseY = 0;
            let detailCardTimer = null;
            let detailCardLocked = false;

            function buildAllData() {
                const solarTerms = [
                    { name: '立春', pinyin: 'LI CHUN', season: 'spring', huangjing: 315, foods: '春饼、咬春萝卜',
                        health: '宜养肝护阳、少酸多甘、早睡早起，食韭菜、豆芽以助阳气升发。',
                        poem: '东风解冻蛰虫振，鱼陟负冰春气新。', origin: '立春为二十四节气之首，太阳到达黄经315°，标志着春季的开始。',
                        customs: '迎春、咬春、打春牛、贴春联。', month: 2, emoji: '🌸' },
                    { name: '雨水', pinyin: 'YU SHUI', season: 'spring', huangjing: 330, foods: '龙须面、春笋',
                        health: '宜健脾祛湿、养护脾胃，食红枣、山药、薏仁粥。', poem: '獭祭鱼时鸿雁来，草木萌动雨丝裁。',
                        origin: '太阳到达黄经330°，降水渐增，冰雪融化。', customs: '回娘家、拉保保、接寿。', month: 2,
                    emoji: '🌧️' },
                    { name: '惊蛰', pinyin: 'JING ZHE', season: 'spring', huangjing: 345, foods: '梨、炒豆',
                        health: '宜疏肝理气、润肺防燥，食梨润喉、菠菜养血。', poem: '桃始华时仓庚鸣，鹰化为鸠春雷惊。',
                        origin: '太阳到达黄经345°，春雷乍动，万物复苏。', customs: '吃梨、打小人、祭白虎。', month: 3, emoji: '⚡' },
                    { name: '春分', pinyin: 'CHUN FEN', season: 'spring', huangjing: 0, foods: '春菜、太阳糕',
                        health: '宜阴阳平衡、调和气血，食春菜、蜂蜜、红枣。', poem: '玄鸟至兮雷乃声，始电划破昼夜平。',
                        origin: '太阳到达黄经0°，昼夜等长，春季的中点。', customs: '竖蛋、送春牛、粘雀嘴。', month: 3, emoji: '🥚' },
                    { name: '清明', pinyin: 'QING MING', season: 'spring', huangjing: 15, foods: '青团、馓子',
                        health: '宜清肝明目、祛湿防寒，食青团、荠菜、菊花茶。', poem: '桐始华时田鼠化，虹始见处雨初晴。',
                        origin: '太阳到达黄经15°，气清景明，万物皆显。', customs: '扫墓、踏青、放风筝、插柳。', month: 4, emoji: '🪁' },
                    { name: '谷雨', pinyin: 'GU YU', season: 'spring', huangjing: 30, foods: '谷雨茶、香椿',
                        health: '宜养肝护脾、祛湿清热，饮谷雨茶、食香椿炒蛋。', poem: '萍始生时鸠拂羽，戴胜降桑春将去。',
                        origin: '太阳到达黄经30°，雨生百谷，春将尽。', customs: '喝谷雨茶、赏牡丹、祭海。', month: 4, emoji: '🍵' },
                    { name: '立夏', pinyin: 'LI XIA', season: 'summer', huangjing: 45, foods: '立夏蛋、尝三鲜',
                        health: '宜清心静养、清淡饮食、顺时消暑，多食酸味以固表。', poem: '蝼蝈鸣兮夏气升，蚯蚓出壤王瓜生。',
                        origin: '太阳到达黄经45°，夏季开始，万物繁茂。', customs: '吃立夏蛋、秤人、尝新。', month: 5, emoji: '🌿',
                        isCurrent: true, currentHouIndex: 2 },
                    { name: '小满', pinyin: 'XIAO MAN', season: 'summer', huangjing: 60, foods: '苦菜、麦糕',
                        health: '宜清热利湿、养心健脾，食苦菜、冬瓜、薏仁。', poem: '苦菜秀时靡草死，麦秋至处籽粒实。',
                        origin: '太阳到达黄经60°，麦类等夏熟作物籽粒渐满。', customs: '祭车神、祈蚕节。', month: 5, emoji: '🌾' },
                    { name: '芒种', pinyin: 'MANG ZHONG', season: 'summer', huangjing: 75, foods: '梅子、粽子',

            function resizeCanvas() {
                const wrapperRect = wrapper.getBoundingClientRect();
                const maxSize = Math.min(window.innerWidth * 0.55, window.innerHeight * 0.78, 750);
                canvasSize = Math.max(480, Math.floor(maxSize));
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                centerX = canvasSize / 2;
                centerY = canvasSize / 2;
                const dpr = window.devicePixelRatio || 1;
                if (dpr > 1 && canvasSize < 600) {
                    canvas.width = canvasSize * dpr;
                    canvas.height = canvasSize * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    canvas.style.width = canvasSize + 'px';
                    canvas.style.height = canvasSize + 'px';
                }
            }

            function getSeasonColor(season, variant = 'main') {
                const map = {
                    spring: variant === 'light' ? '#8DB76B' : variant === 'dark' ? '#4A7A2E' : '#6B9B4A',
                    summer: variant === 'light' ? '#E0705E' : variant === 'dark' ? '#9B3020' : '#C44D3D',
                    autumn: variant === 'light' ? '#DBA960' : variant === 'dark' ? '#A67025' : '#C8893D',
                    winter: variant === 'light' ? '#A3C0D6' : variant === 'dark' ? '#5A7D95' : '#7A9BB5',
                };
                return map[season] || '#888';
            }

            function getSeasonEmoji(season) {
                return { spring: '🌸', summer: '☀️', autumn: '🍂', winter: '❄️' } [season] || '🌿';
            }

            function getSeasonPatternName(season) {
                return { spring: '梅花', summer: '荷花', autumn: '菊花', winter: '雪花' } [season] || '';
            }

            function drawSeasonPattern(season, cx, cy, radius, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = getSeasonColor(season, 'light');
                ctx.strokeStyle = getSeasonColor(season, 'light');
                ctx.lineWidth = 1;
                const n = 24;
                for (let i = 0; i < n; i++) {
                    const angle = (i / n) * Math.PI * 2;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    ctx.beginPath();
                    if (season === 'spring') {
                        for (let p = 0; p < 5; p++) {
                            const pa = angle + (p - 2) * 0.12;
                            const pr = 8 + Math.abs(p - 2) * 4;
                            const px = cx + Math.cos(pa) * (radius + pr);
                            const py = cy + Math.sin(pa) * (radius + pr);
                            if (p === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                    } else if (season === 'summer') {
                        for (let p = 0; p < 7; p++) {
                            const pa = angle + (p - 3) * 0.1;
                            const pr = 10 - Math.abs(p - 3) * 2.5;
                            const px = cx + Math.cos(pa) * (radius + pr);
                            const py = cy + Math.sin(pa) * (radius + pr);
                            if (p === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                    } else if (season === 'autumn') {
                        for (let p = 0; p < 12; p++) {
                            const pa = angle + (p / 11) * 0.4 - 0.2;
                            const pr = 6 + Math.sin((p / 11) * Math.PI) * 8;
                            const px = cx + Math.cos(pa) * (radius + pr);
                            const py = cy + Math.sin(pa) * (radius + pr);
                            if (p === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.arc(x, y, 4 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fill();
                        const sx = cx + Math.cos(angle + 0.3) * (radius + 8);
                        const sy = cy + Math.sin(angle + 0.3) * (radius + 8);
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            function drawWheel(timestamp) {
                ctx.clearRect(0, 0, canvasSize, canvasSize);
                const cx = centerX;
                const cy = centerY;
                const maxR = canvasSize * 0.44;
                const centerR = maxR * 0.16;
                const innerR = maxR * 0.34;
                const middleR = maxR * 0.7;
                const outerPatternR = maxR * 0.88;

                const currentSeason = allData.solarTerms[currentSolarIndex].season;
                drawSeasonPattern(currentSeason, cx, cy, outerPatternR, 0.18);

                const bgGrad = ctx.createRadialGradient(cx, cy, centerR * 0.5, cx, cy, maxR);
                bgGrad.addColorStop(0, '#3a3528');
                bgGrad.addColorStop(0.5, '#2a251d');
                bgGrad.addColorStop(1, '#1a1812');
                ctx.beginPath();
                ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
                ctx.fillStyle = bgGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(201,169,110,0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotationOffset);

                for (let i = 0; i < 72; i++) {
                    const hou = allData.houList[i];
                    const startAngle = (i * 5 - 90) * Math.PI / 180;
                    const endAngle = ((i + 1) * 5 - 90) * Math.PI / 180;
                    const isCurrentHou = (i === currentSolarIndex * 3 + currentHouIndex);
                    const isHovered = (hoveredHouGlobal !== null && hoveredHouGlobal.globalIndex === i);
                    const isSelected = (selectedHouGlobal !== null && selectedHouGlobal.globalIndex === i);
                    const isInCurrentSolar = (hou.solarIndex === currentSolarIndex);

                    const sColor = getSeasonColor(hou.season, 'main');
                    const sColorLight = getSeasonColor(hou.season, 'light');

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, middleR, startAngle, endAngle);
                    ctx.closePath();
                    let fillAlpha = 0.18;
                    if (isInCurrentSolar && !isCurrentHou) fillAlpha = 0.32;
                    if (isCurrentHou) fillAlpha = 0.5;
                    if (isHovered) fillAlpha = 0.6;
                    if (isSelected) fillAlpha = 0.65;
                    ctx.fillStyle = sColor.replace(')', `, ${fillAlpha})`).replace('rgb',
                        'rgba').replace('#6B9B4A', 'rgba(107,155,74,' + fillAlpha + ')').replace('#C44D3D',
                        'rgba(196,77,61,' + fillAlpha + ')').replace('#C8893D', 'rgba(200,137,61,' + fillAlpha +
                        ')').replace('#7A9BB5', 'rgba(122,155,181,' + fillAlpha + ')');
                    if (ctx.fillStyle === sColor) ctx.fillStyle = sColorLight.replace(')', `, ${fillAlpha})`);
                    ctx.fill();

                    if (isCurrentHou || isHovered || isSelected) {
                        ctx.strokeStyle = '#C9A96E';
                        ctx.lineWidth = isSelected ? 3 : (isHovered ? 2.5 : 2);
                        ctx.shadowColor = 'rgba(201,169,110,0.7)';
                        ctx.shadowBlur = isSelected ? 14 : (isHovered ? 10 : 6);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.strokeStyle = 'rgba(180,160,130,0.25)';
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }

                    const midAngle = (startAngle + endAngle) / 2;
                    const textR = middleR * 0.72;
                    const tx = Math.cos(midAngle) * textR;
                    const ty = Math.sin(midAngle) * textR;
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(midAngle + Math.PI / 2);
                    ctx.fillStyle = (isCurrentHou || isHovered || isSelected) ? '#f5edd8' : '#c8bfa8';
                    ctx.font = `${isCurrentHou ? 'bold ' : ''}${canvasSize<550?'7':'9'}px "KaiTi","STKaiti","SimSun",serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(hou.name, 0, 0);
                    const foodShort = hou.foodDetail.split('，')[0].slice(0, 5);
                    ctx.fillStyle = '#b0a080';
                    ctx.font = `${canvasSize<550?'6':'7'}px "KaiTi","STKaiti","SimSun",serif`;
                    ctx.fillText(foodShort, 0, canvasSize < 550 ? 10 : 13);
                    ctx.restore();
                }

                for (let i = 0; i < 24; i++) {
                    const st = allData.solarTerms[i];
                    const angle = (i * 15 - 90) * Math.PI / 180;
                    const isCurrent = (i === currentSolarIndex);
                    const r1 = innerR;
                    const r2 = centerR;
                    const midR = (r1 + r2) / 2;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle - 0.04) * r2, Math.sin(angle - 0.04) * r2);
                    ctx.arc(0, 0, r1, angle - 0.04, angle + 0.04);
                    ctx.lineTo(Math.cos(angle + 0.04) * r2, Math.sin(angle + 0.04) * r2);
                    ctx.arc(0, 0, r2, angle + 0.04, angle - 0.04, true);
                    ctx.closePath();
                    ctx.fillStyle = isCurrent ? 'rgba(201,169,110,0.45)' : 'rgba(60,50,35,0.35)';
                    ctx.fill();
                    if (isCurrent) {
                        ctx.strokeStyle = '#C9A96E';
                        ctx.lineWidth = 2.5;
                        ctx.shadowColor = 'rgba(201,169,110,0.8)';
                        ctx.shadowBlur = 12;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.strokeStyle = 'rgba(150,130,100,0.3)';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                    const tx = Math.cos(angle) * midR;
                    const ty = Math.sin(angle) * midR;
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(angle + Math.PI / 2);
                    ctx.fillStyle = isCurrent ? '#f5e8c8' : '#d5cba8';
                    ctx.font = `${isCurrent ? 'bold ' : ''}${canvasSize<550?'8':'11'}px "KaiTi","STKaiti","SimSun",serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(st.name, 0, 0);
                    const hjText = st.huangjing + '°';
                    ctx.fillStyle = '#a09878';
                    ctx.font = `${canvasSize<550?'6':'8'}px serif`;
                    ctx.fillText(hjText, 0, canvasSize < 550 ? 10 : 14);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(0, 0, centerR, 0, Math.PI * 2);
                const centerGrad = ctx.createRadialGradient(0, 0, centerR * 0.2, 0, 0, centerR);
                const cs = getSeasonColor(currentSeason, 'main');
                const csLight = getSeasonColor(currentSeason, 'light');
                centerGrad.addColorStop(0, '#fdf5e0');
                centerGrad.addColorStop(0.4, csLight);
                centerGrad.addColorStop(1, cs);
                ctx.fillStyle = centerGrad;
                ctx.fill();
                ctx.strokeStyle = '#C9A96E';
                ctx.lineWidth = 3;
                ctx.shadowColor = 'rgba(201,169,110,0.6)';
                ctx.shadowBlur = 18;
                ctx.stroke();
                ctx.shadowBlur = 0;

                const cs2 = allData.solarTerms[currentSolarIndex];
                ctx.fillStyle = '#2a2218';
                ctx.font = `bold ${canvasSize<550?'13':'17'}px "KaiTi","STKaiti","SimSun",serif`;
                ctx.textAlign = 'center';
                ctx.fillText(cs2.name, 0, canvasSize < 550 ? -6 : -8);
                ctx.fillStyle = '#8a7a5a';
                ctx.font = `${canvasSize<550?'7':'9'}px serif`;
                ctx.fillText(cs2.pinyin, 0, canvasSize < 550 ? 10 : 14);
                const semoji = cs2.emoji || getSeasonEmoji(currentSeason);
                ctx.font = `${canvasSize<550?'14':'20'}px serif`;
                ctx.fillText(semoji, 0, canvasSize < 550 ? -20 : -28);

                ctx.restore();

                const indicatorAngle = -90 * Math.PI / 180;
                const indX = cx + Math.cos(indicatorAngle) * (maxR + 14);
                const indY = cy + Math.sin(indicatorAngle) * (maxR + 14);
                ctx.fillStyle = '#C9A96E';
                ctx.beginPath();
                ctx.moveTo(indX, indY - 8);
                ctx.lineTo(indX + 14, indY);
                ctx.lineTo(indX, indY + 8);
                ctx.closePath();
                ctx.fill();
                ctx.shadowColor = 'rgba(201,169,110,0.8)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function getHouAtAngle(worldAngle) {
                let localAngle = worldAngle - rotationOffset;
                while (localAngle < -Math.PI) localAngle += Math.PI * 2;
                while (localAngle > Math.PI) localAngle -= Math.PI * 2;
                let deg = localAngle * 180 / Math.PI + 90;
                while (deg < 0) deg += 360;
                while (deg >= 360) deg -= 360;
                const houIndex = Math.floor(deg / 5);
                if (houIndex >= 0 && houIndex < 72) return allData.houList[houIndex];
                return null;
            }

            function getSolarAtAngle(worldAngle) {
                let localAngle = worldAngle - rotationOffset;
                while (localAngle < -Math.PI) localAngle += Math.PI * 2;
                while (localAngle > Math.PI) localAngle -= Math.PI * 2;
                let deg = localAngle * 180 / Math.PI + 90;
                while (deg < 0) deg += 360;
                while (deg >= 360) deg -= 360;
                const solarIndex = Math.floor(deg / 15);
                if (solarIndex >= 0 && solarIndex < 24) return solarIndex;
                return null;
            }

            function updateDetailCard(hou) {
                if (!hou) return;
                detailTitle.textContent = hou.name;
                detailIcon.textContent = hou.emoji || '🌿';
                detailIndex.textContent = '第' + (hou.globalIndex + 1) + '候（' + hou.solarName + '·' + ['初候', '二候',
                    '三候'
                ][hou.houIndex] + '）';
                detailDesc.textContent = hou.desc;
                detailPoem.textContent = hou.poem;
                detailProverb.textContent = hou.proverb;
                detailFood.textContent = hou.foodDetail;
                detailCard.classList.add('visible');
                if (detailCardTimer) clearTimeout(detailCardTimer);
            }

            function hideDetailCard() {
                if (!detailCardLocked) {
                    detailCardTimer = setTimeout(() => {
                        detailCard.classList.remove('visible');
                    }, 300);
                }
            }

            function updateUI(solarIndex, houIndex) {
                currentSolarIndex = solarIndex;
                currentHouIndex = houIndex;
                const st = allData.solarTerms[solarIndex];
                seasonVisual.innerHTML = st.name + '<span class="pinyin">' + st.pinyin + '</span>';
                seasonMiniIcon.textContent = st.emoji || getSeasonEmoji(st.season);
                bottomPoem.textContent = st.poem;
                bottomHealth.textContent = '🍵 ' + st.name + '养生：' + st.health;
                const hou = allData.houList[solarIndex * 3 + houIndex];
                updateDetailCard(hou);
                detailCardLocked = false;
                selectedHouGlobal = hou;
                updateTimelineDots();
                if (sidebarDetail.classList.contains('open')) {
                    updateSidebarContent(solarIndex);
                }
            }

            function updateTimelineDots() {
                timelineRow.innerHTML = '';
                allData.solarTerms.forEach((st, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'timeline-dot season-' + st.season;
                    if (i === currentSolarIndex) dot.classList.add('active');
                    dot.title = st.name + ' ' + st.pinyin + ' (' + st.huangjing + '°)';
                    dot.textContent = st.name.charAt(0);
                    dot.addEventListener('click', () => {
                        navigateToSolar(i, 0);
                    });
                    timelineRow.appendChild(dot);
                });
            }

            function navigateToSolar(solarIndex, houIndex) {
                currentSolarIndex = solarIndex;
                currentHouIndex = houIndex || 0;
                const st = allData.solarTerms[solarIndex];
                const targetLocalDeg = solarIndex * 15;
                const targetWorldDeg = 0;
                targetRotation = (targetWorldDeg - targetLocalDeg) * Math.PI / 180;
                updateUI(solarIndex, currentHouIndex);
                detailCardLocked = false;
                selectedHouGlobal = allData.houList[solarIndex * 3 + currentHouIndex];
            }

            function updateSidebarContent(solarIndex) {
                const st = allData.solarTerms[solarIndex];
                sidebarTitle.textContent = st.name + ' · 详情';
                let html = '';
                html += '<div class="section"><h5>📖 节气渊源</h5><p>' + st.origin + '</p></div>';
                html += '<div class="section"><h5>🌡️ 太阳黄经</h5><p>' + st.huangjing + '°（' + (solarIndex * 15) +
                    '°从春分起算）</p></div>';
                html += '<div class="section"><h5>🌿 三候详解</h5>';
                for (let h = 0; h < 3; h++) {
                    const hou = allData.houList[solarIndex * 3 + h];
                    html += '<p><strong>' + ['初候', '二候', '三候'][h] + '：' + hou.name + '</strong> — ' + hou.desc +
                        '</p>';
                }
                html += '</div>';
                html += '<div class="section"><h5>🎉 民俗活动</h5><p>' + st.customs + '</p></div>';
                html += '<div class="section"><h5>🍽️ 专属吃食</h5><p>' + st.foods + '</p></div>';
                html += '<div class="section"><h5>🧘 养生指引</h5><p>' + st.health + '</p></div>';
                html += '<div class="section"><h5>📝 节气诗句</h5><p>' + st.poem + '</p></div>';
                sidebarContent.innerHTML = html;
            }

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxR = canvasSize * 0.44;
                const middleR = maxR * 0.7;
                const innerR = maxR * 0.34;
                if (dist > innerR * 0.85 && dist < middleR * 1.05) {
                    const worldAngle = Math.atan2(dy, dx);
                    const hou = getHouAtAngle(worldAngle);
                    if (hou && (!hoveredHouGlobal || hoveredHouGlobal.globalIndex !== hou.globalIndex)) {
                        hoveredHouGlobal = hou;
                        if (!detailCardLocked) updateDetailCard(hou);
                        canvas.style.cursor = 'pointer';
                    } else if (!hou) {
                        hoveredHouGlobal = null;
                        if (!detailCardLocked) hideDetailCard();
                        canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
                    }
                } else {
                    if (hoveredHouGlobal && !detailCardLocked) hideDetailCard();
                    hoveredHouGlobal = null;
                    canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
                }
            });

            canvas.addEventListener('click', (e) => {
                if (isDragging) return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const dx = mx - centerX;
                const dy = my - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxR = canvasSize * 0.44;
                const middleR = maxR * 0.7;
                const innerR = maxR * 0.34;
                const centerR = maxR * 0.16;
                if (dist < centerR * 1.1) {
                    detailCardLocked = false;
                    selectedHouGlobal = allData.houList[currentSolarIndex * 3 + currentHouIndex];
                    updateDetailCard(selectedHouGlobal);
                    return;
                }
                if (dist > innerR * 0.85 && dist < middleR * 1.05) {
                    const worldAngle = Math.atan2(dy, dx);
                    const hou = getHouAtAngle(worldAngle);
                    if (hou) {
                        detailCardLocked = true;
                        selectedHouGlobal = hou;
                        updateDetailCard(hou);
                        currentSolarIndex = hou.solarIndex;
                        currentHouIndex = hou.houIndex;
                        updateUI(currentSolarIndex, currentHouIndex);
                        detailCardLocked = true;
                        selectedHouGlobal = hou;
                    }
                }
                if (dist > innerR * 0.5 && dist < innerR * 1.15) {
                    const worldAngle = Math.atan2(dy, dx);
                    const si = getSolarAtAngle(worldAngle);
                    if (si !== null && si !== currentSolarIndex) {
                        navigateToSolar(si, 0);
                    }
                }
            });

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const dx = mx - centerX;
                const dy = my - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxR = canvasSize * 0.44;
                if (dist < maxR * 1.1) {
                    isDragging = true;
                    dragStartAngle = Math.atan2(dy, dx);
                    dragStartRotation = rotationOffset;
                    canvas.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const dx = mx - centerX;
                const dy = my - centerY;
                const currentAngle = Math.atan2(dy, dx);
                let delta = currentAngle - dragStartAngle;
                if (delta > Math.PI) delta -= Math.PI * 2;
                if (delta < -Math.PI) delta += Math.PI * 2;
                rotationOffset = dragStartRotation + delta;
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    canvas.style.cursor = hoveredHouGlobal ? 'pointer' : 'grab';
                    let deg = (-rotationOffset * 180 / Math.PI);
                    while (deg < 0) deg += 360;
                    while (deg >= 360) deg -= 360;
                    const nearestSolar = Math.round(deg / 15) % 24;
                    const snappedSolar = (nearestSolar + 24) % 24;
                    targetRotation = -(snappedSolar * 15) * Math.PI / 180;
                    currentSolarIndex = snappedSolar;
                    currentHouIndex = 0;
                    updateUI(currentSolarIndex, currentHouIndex);
                    detailCardLocked = false;
                }
            });

            canvas.addEventListener('mouseleave', () => {
                hoveredHouGlobal = null;
                if (!detailCardLocked) hideDetailCard();
                if (!isDragging) canvas.style.cursor = 'grab';
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.04 : -0.04;
                rotationOffset += delta;
                let deg = (-rotationOffset * 180 / Math.PI);
                while (deg < 0) deg += 360;
                while (deg >= 360) deg -= 360;
                const nearestSolar = Math.round(deg / 15) % 24;
                const snappedSolar = (nearestSolar + 24) % 24;
                targetRotation = -(snappedSolar * 15) * Math.PI / 180;
                if (Math.abs(rotationOffset - targetRotation) < 0.01) {
                    currentSolarIndex = snappedSolar;
                    currentHouIndex = 0;
                    updateUI(currentSolarIndex, currentHouIndex);
                    detailCardLocked = false;
                }
            }, { passive: false });

            btnCompare.addEventListener('click', () => {
                if (!compareMode) {
                    compareMode = true;
                    compareFirst = currentSolarIndex;
                    compareSecond = null;
                    compareCard.innerHTML =
                        '<div class="compare-col"><h4>已选：' + allData.solarTerms[compareFirst].name +
                        '</h4><p>请点击轮盘选择第二个节气</p></div>';
                    overlayCompare.classList.add('active');
                    btnCompare.textContent = '选择第二个节气...';
                    btnCompare.style.borderColor = '#ff9800';
                }
            });

            compareClose.addEventListener('click', () => {
                compareMode = false;
                compareFirst = null;
                compareSecond = null;
                overlayCompare.classList.remove('active');
                btnCompare.textContent = '⚖️ 节气对比';
                btnCompare.style.borderColor = '';
            });

            overlayCompare.addEventListener('click', function(e) {
                if (e.target === this && !compareSecond) {
                    compareMode = false;
                    compareFirst = null;
                    overlayCompare.classList.remove('active');
                    btnCompare.textContent = '⚖️ 节气对比';
                    btnCompare.style.borderColor = '';
                }
            });

            const origCanvasClick = canvas.onclick;
            canvas.addEventListener('click', function(e) {
                if (compareMode && compareFirst !== null && compareSecond === null) {
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    const dx = mx - centerX;
                    const dy = my - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = canvasSize * 0.44;
                    const innerR = maxR * 0.34;
                    if (dist > innerR * 0.5 && dist < maxR * 0.75) {
                        const worldAngle = Math.atan2(dy, dx);
                        const si = getSolarAtAngle(worldAngle);
                        if (si !== null && si !== compareFirst) {
                            compareSecond = si;
                            const s1 = allData.solarTerms[compareFirst];
                            const s2 = allData.solarTerms[compareSecond];
                            let html = '<div class="compare-col"><h4>' + s1.emoji + ' ' + s1.name +
                                '</h4>';
                            html += '<p><strong>三候：</strong>' + allData.allHous[compareFirst].join(
                                '、') + '</p>';
                            html += '<p><strong>民俗：</strong>' + s1.customs + '</p>';
                            html += '<p><strong>吃食：</strong>' + s1.foods + '</p>';
                            html += '<p><strong>黄经：</strong>' + s1.huangjing + '°</p>';
                            html += '</div>';
                            html += '<div class="compare-col"><h4>' + s2.emoji + ' ' + s2.name +
                                '</h4>';
                            html += '<p><strong>三候：</strong>' + allData.allHous[compareSecond].join(
                                '、') + '</p>';
                            html += '<p><strong>民俗：</strong>' + s2.customs + '</p>';
                            html += '<p><strong>吃食：</strong>' + s2.foods + '</p>';
                            html += '<p><strong>黄经：</strong>' + s2.huangjing + '°</p>';
                            html += '</div>';
                            html +=
                                '<div style="width:100%;text-align:center;color:#C9A96E;margin-top:8px;">点击关闭按钮退出对比</div>';
                            compareCard.innerHTML = html;
                            compareMode = false;
                            btnCompare.textContent = '⚖️ 节气对比';
                            btnCompare.style.borderColor = '';
                        }
                    }
                }
            });

            btnDetail.addEventListener('click', () => {
                sidebarDetail.classList.toggle('open');
                if (sidebarDetail.classList.contains('open')) {
                    updateSidebarContent(currentSolarIndex);
                }
            });

            sidebarClose.addEventListener('click', () => {
                sidebarDetail.classList.remove('open');
            });

            btnReset.addEventListener('click', () => {
                const now = new Date();
                const month = now.getMonth() + 1;
                const day = now.getDate();
                let foundSolar = 0;
                const solarRanges = [
                    { s: 0, m: 2, dStart: 3, dEnd: 18 },
                    { s: 1, m: 2, dStart: 18, dEnd: 29 },
                    { s: 2, m: 3, dStart: 5, dEnd: 20 },
                    { s: 3, m: 3, dStart: 20, dEnd: 31 },
                    { s: 4, m: 4, dStart: 4, dEnd: 19 },
                    { s: 5, m: 4, dStart: 19, dEnd: 30 },
                    { s: 6, m: 5, dStart: 5, dEnd: 20 },
                    { s: 7, m: 5, dStart: 20, dEnd: 31 },
                    { s: 8, m: 6, dStart: 5, dEnd: 21 },
                    { s: 9, m: 6, dStart: 21, dEnd: 30 },
                    { s: 10, m: 7, dStart: 6, dEnd: 22 },
                    { s: 11, m: 7, dStart: 22, dEnd: 31 },
                    { s: 12, m: 8, dStart: 7, dEnd: 22 },
                    { s: 13, m: 8, dStart: 22, dEnd: 31 },
                    { s: 14, m: 9, dStart: 7, dEnd: 22 },
                    { s: 15, m: 9, dStart: 22, dEnd: 30 },
                    { s: 16, m: 10, dStart: 7, dEnd: 23 },
                    { s: 17, m: 10, dStart: 23, dEnd: 31 },
                    { s: 18, m: 11, dStart: 7, dEnd: 21 },
                    { s: 19, m: 11, dStart: 21, dEnd: 30 },
                    { s: 20, m: 12, dStart: 6, dEnd: 21 },
                    { s: 21, m: 12, dStart: 21, dEnd: 31 },
                    { s: 22, m: 1, dStart: 5, dEnd: 19 },
                    { s: 23, m: 1, dStart: 19, dEnd: 31 },
                ];
                for (const r of solarRanges) {
                    if ((month === r.m && day >= r.dStart && day <= r.dEnd) || (month === r.m + 1 && day < r
                            .dStart && r.m === 12)) {
                        foundSolar = r.s;
                        break;
                    }
                }
                if (month === 1 && day < 5) foundSolar = 22;
                if (month === 2 && day < 3) foundSolar = 23;
                navigateToSolar(foundSolar, 0);
                rotationOffset = -(foundSolar * 15) * Math.PI / 180;
                targetRotation = rotationOffset;
                detailCardLocked = false;
            });

            updateTimelineDots();

            function getInitialSolar() {
                const now = new Date();
                const month = now.getMonth() + 1;
                const day = now.getDate();
                if (month === 5 && day >= 5 && day < 21) return { s: 6, h: Math.min(2, Math.floor((day - 5) / 5)) };
                if (month === 5 && day >= 21) return { s: 7, h: Math.min(2, Math.floor((day - 21) / 5)) };
                if (month === 6 && day < 6) return { s: 7, h: Math.min(2, Math.floor((day - 21 + 31) / 5)) };
                if (month === 6 && day >= 6 && day < 22) return { s: 8, h: Math.min(2, Math.floor((day - 6) / 5)) };
                if (month === 6 && day >= 22) return { s: 9, h: Math.min(2, Math.floor((day - 22) / 5)) };
                if (month === 7 && day < 7) return { s: 9, h: Math.min(2, Math.floor((day - 22 + 30) / 5)) };
                if (month === 7 && day >= 7 && day < 23) return { s: 10, h: Math.min(2, Math.floor((day - 7) / 5)) };
                if (month === 7 && day >= 23) return { s: 11, h: Math.min(2, Math.floor((day - 23) / 5)) };
                if (month === 8 && day < 8) return { s: 11, h: Math.min(2, Math.floor((day - 23 + 31) / 5)) };
                if (month === 8 && day >= 8 && day < 23) return { s: 12, h: Math.min(2, Math.floor((day - 8) / 5)) };
                if (month === 5 && day >= 15) return { s: 6, h: 2 };
                return { s: 6, h: 2 };
            }
            const initSolar = getInitialSolar();
            currentSolarIndex = initSolar.s;
            currentHouIndex = initSolar.h;
            rotationOffset = -(currentSolarIndex * 15) * Math.PI / 180;
            targetRotation = rotationOffset;
            updateUI(currentSolarIndex, currentHouIndex);

            function animate(timestamp) {
                if (!isDragging) {
                    const diff = targetRotation - rotationOffset;
                    if (Math.abs(diff) > 0.0005) {
                        rotationOffset += diff * 0.15;
                        if (Math.abs(diff) < 0.002) rotationOffset = targetRotation;
                    }
                }
                resizeCanvas();
                drawWheel(timestamp);
                animationId = requestAnimationFrame(animate);
            }

            resizeCanvas();
            updateUI(currentSolarIndex, currentHouIndex);
            rotationOffset = -(currentSolarIndex * 15) * Math.PI / 180;
            targetRotation = rotationOffset;
            animationId = requestAnimationFrame(animate);

            setTimeout(() => {
                loadingOverlay.classList.add('done');
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 700);
            }, 900);

            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    navigateToSolar((currentSolarIndex + 1) % 24, 0);
                    targetRotation = -(currentSolarIndex * 15) * Math.PI / 180;
                } else if (e.key === 'ArrowLeft') {
                    navigateToSolar((currentSolarIndex - 1 + 24) % 24, 0);
                    targetRotation = -(currentSolarIndex * 15) * Math.PI / 180;
                } else if (e.key === 'Escape') {
                    detailCardLocked = false;
                    hideDetailCard();
                    compareMode = false;
                    overlayCompare.classList.remove('active');
                    btnCompare.textContent = '⚖️ 节气对比';
                    btnCompare.style.borderColor = '';
                    sidebarDetail.classList.remove('open');
                }
            });

            console.log('✅ 岁时轮转·七十二候 可视化系统已就绪');
            console.log('   - 24节气 | 72候 | 完整物候数据');
            console.log('   - 民俗吃食 | 诗句农谚 | 养生古训');
            console.log('   - 拖拽旋转 | 悬浮预览 | 点击锁定');
            console.log('   - 节气对比 | 详情侧栏 | 时间轴导航');
            console.log('   - 四季纹样 | 加载动效 | 鎏金国风');
            console.log('   当前节气：' + allData.solarTerms[currentSolarIndex].name + ' | 第' + (currentHouIndex + 1) +
                '候：' + allData.houList[currentSolarIndex * 3 + currentHouIndex].name);
        })();
    </script>
</body>
</html>
