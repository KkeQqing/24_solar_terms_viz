<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惊蛰 · 二十四节气</title>
    <style>
        /* 全局初始化样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f0e1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* 卷轴容器 */
        .scroll-container {
            background-color: #f8f2e4; /* 浅米黄卷轴底色 */
            border: 1px solid #d4c8b0;
            border-radius: 8px;
            padding: 24px;
            max-width: 320px; /* 适配大屏左侧竖栏 */
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 通用板块样式 */
        .section {
            border-bottom: 1px solid #d4c8b0; /* 细线条分割 */
            padding-bottom: 12px;
        }
        .section:last-child {
            border-bottom: none;
        }

        /* 1. 卷首主标题区 */
        .header-section {
            text-align: center;
        }
        .festival-title {
            font-family: "HanYi ShangWei ShouShu", "STKaiti", "KaiTi", serif; /* 国风书法字体 */
            font-size: 3rem;
            color: #333;
            margin: 0;
        }
        .festival-pinyin {
            font-size: 1rem;
            color: #666;
            margin: 4px 0;
        }
        .festival-info {
            font-size: 0.9rem;
            color: #888;
        }

        /* 2. 单候标识区 */
        .hou-section .hou-label {
            font-weight: bold;
            font-size: 1.2rem;
            color: #5a7d5a; /* 清新绿色 */
            text-align: center;
        }

        /* 3. 诗词区 */
        .poem-section {
            text-align: center;
        }
        .poem-text {
            font-family: "KaiTi", "STKaiti", serif; /* 行楷字体 */
            font-size: 1.1rem;
            color: #444;
            line-height: 1.6;
        }
        .poem-author {
            font-size: 0.9rem;
            color: #666;
            margin-top: 4px;
        }

        /* 4. 谚语区 */
        .proverb-section .proverb-label {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
        }

        /* 5. 释义+原理区 */
        .explain-section .explain-title {
            font-weight: bold;
            color: #5a7d5a;
            margin-bottom: 4px;
        }
        .explain-section .explain-content {
            font-size: 0.95rem;
            color: #444;
            margin: 0 0 8px 0;
            line-height: 1.5;
        }

        /* 6. 养生专区 */
        .health-section .health-item {
            margin-bottom: 8px;
        }
        .health-section .health-title {
            font-weight: bold;
            color: #5a7d5a;
            margin-bottom: 2px;
        }
        .health-section .health-content {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <!-- 1. 卷首主标题区 -->
        <div class="section header-section">
            <h1 class="festival-title">惊蛰</h1>
            <p class="festival-pinyin">JING ZHE · 仲春</p>
            <p class="festival-info">🌧️ 二月 · 太阳黄经 330°</p>
        </div>

        <!-- 2. 当期单候专属标识区 -->
        <div class="section hou-section">
            <p class="hou-label">惊蛰初候 · 桃始华</p>
        </div>

        <!-- 3. 候意专属诗词区 -->
        <div class="section poem-section">
            <p class="poem-text">竹外桃花三两枝，春江水暖鸭先知。</p>
            <p class="poem-author">—— 苏轼《惠崇春江晚景》</p>
        </div>

        <!-- 4. 时令民俗谚语区 -->
        <div class="section proverb-section">
            <p class="proverb-label">【节气谚语】惊蛰过，暖和和，蛤蟆老角唱山歌。</p>
        </div>

        <!-- 5. 单候释义 + 自然原理区 -->
        <div class="section explain-section">
            <div class="explain-item">
                <p class="explain-title">【候象实景释义】</p>
                <p class="explain-content">桃花初绽，昆虫苏醒，春气渐生，万物萌动。</p>
            </div>
            <div class="explain-item">
                <p class="explain-title">【时令运行原理】</p>
                <p class="explain-content">太阳到达黄经330°，气温回升，地温升高，桃树打破休眠，花芽开放。</p>
            </div>
        </div>

        <!-- 6. 顺时四季养生专区 -->
        <div class="section health-section">
            <div class="health-item">
                <p class="health-title">🍵 饮食调养</p>
                <p class="health-content">春笋、菠菜应季，疏肝理气，助春生发。</p>
            </div>
            <div class="health-item">
                <p class="health-title">🧘 起居作息</p>
                <p class="health-content">早睡早起，多散步，顺应阳气升发。</p>
            </div>
            <div class="health-item">
                <p class="health-title">🌤️ 时节防护</p>
                <p class="health-content">早晚温差大，注意添衣，防寒湿侵体。</p>
            </div>
        </div>
    </div>
</body>
</html>
